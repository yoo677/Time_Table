<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Time Table">
  <title>Time Table</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app" data-tab="calendar">
    <!-- 맨 위: 날짜, 시계, 날씨 -->
    <header class="topbar">
      <div class="clock">
        <span id="clock-date" class="clock-date"></span>
        <span id="clock-time" class="clock-time"></span>
      </div>
      <!-- 오른쪽: 시간별 기온 그래프와 현재 날씨 -->
      <div id="wx-hourly" class="wx-hourly" role="img" aria-label="시간별 기온"></div>
      <button type="button" id="wx-now" class="wx-now" aria-expanded="false" aria-controls="wx-hourly">
        <span id="wx-icon" class="wx-icon" aria-hidden="true"></span>
        <span class="wx-text">
          <strong id="wx-temp"></strong>
          <span id="wx-desc" class="wx-desc"></span>
        </span>
        <span id="wx-place" class="wx-place"></span>
      </button>
    </header>

    <div class="main">
      <!-- 왼쪽: 달력 -->
      <main id="calendar" class="pane calendar">
        <header class="cal-header">
          <div class="segmented" role="group" aria-label="달 이동">
            <button type="button" id="prev-month" class="seg-btn" aria-label="이전 달">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <span id="month-label" class="seg-text"></span>
            <button type="button" id="next-month" class="seg-btn" aria-label="다음 달">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
          <button type="button" id="today-btn" class="soft-btn">오늘</button>
        </header>
        <div class="weekdays" aria-hidden="true">
          <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
        </div>
        <div id="grid" class="grid" role="grid"></div>
      </main>

      <!-- 달력과 할 일 사이 폭 조절 손잡이 -->
      <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="달력과 할 일 폭 조절" tabindex="0"></div>

      <!-- 오른쪽: 할 일 -->
      <aside id="tasks" class="pane tasks">
        <header class="tasks-header">
          <h2 class="tasks-title">할 일</h2>
          <button type="button" id="accounts-btn" class="icon-btn" aria-label="계정 연결" aria-expanded="false" aria-controls="accounts-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          </button>
        </header>
        <div id="accounts-wrap" class="accounts-wrap" hidden>
          <div id="accounts" class="accounts"></div>
        </div>
        <div id="task-list" class="task-list"></div>
      </aside>
    </div>
  </div>

  <!-- 폰에서 왼쪽/오른쪽 전환 -->
  <nav class="tabbar" role="tablist" aria-label="화면 전환">
    <button type="button" role="tab" data-tab="calendar" aria-selected="true">캘린더</button>
    <button type="button" role="tab" data-tab="tasks" aria-selected="false">할 일</button>
  </nav>

  <!-- 하루 시간표 창. 날짜마다 하나씩 복제해서 띄운다 -->
  <template id="win-tpl">
    <section class="win" role="dialog">
      <header class="win-titlebar">
        <div class="win-nav">
          <button type="button" class="tb-btn" data-act="prev" aria-label="전날">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button type="button" class="tb-btn" data-act="next" aria-label="다음날">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <button type="button" class="tb-btn text" data-act="today">오늘</button>
        </div>
        <div class="win-heading">
          <h2 class="win-date"></h2>
          <p class="win-summary"></p>
        </div>
        <div class="win-controls">
          <button type="button" class="tb-btn" data-act="min" aria-label="최소화" title="최소화">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
          </button>
          <button type="button" class="tb-btn close" data-act="close" aria-label="닫기" title="닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
          </button>
        </div>
      </header>
      <div class="win-body">
        <div class="timeline-scroll">
          <div class="timeline">
            <div class="hours"></div>
            <div class="stacks"></div>
            <div class="deadlines"></div>
            <div class="now-line" hidden></div>
          </div>
        </div>
        <div class="drag-tip" hidden></div>
        <button type="button" class="fab" data-act="add" aria-label="스택 추가">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="rz n" data-dir="n"></div><div class="rz s" data-dir="s"></div>
      <div class="rz e" data-dir="e"></div><div class="rz w" data-dir="w"></div>
      <div class="rz ne" data-dir="ne"></div><div class="rz nw" data-dir="nw"></div>
      <div class="rz se" data-dir="se"></div><div class="rz sw" data-dir="sw"></div>
    </section>
  </template>
  <div id="windows"></div>

  <!-- 최소화된 창들 -->
  <div id="dock" class="dock" hidden></div>

  <!-- 할 일을 끄는 동안 손가락을 따라다니는 카드 -->
  <div id="task-ghost" class="task-ghost" hidden></div>

  <!-- 스택 입력 시트 -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <form id="sheet" class="sheet" hidden autocomplete="off" aria-labelledby="sheet-title">
    <div class="grabber" aria-hidden="true"></div>
    <header class="sheet-header">
      <button type="button" id="sheet-cancel" class="text-btn">취소</button>
      <h3 id="sheet-title">새 스택</h3>
      <button type="submit" id="sheet-save" class="text-btn strong">추가</button>
    </header>

    <div class="group">
      <input id="stack-name" class="name-input" maxlength="80" placeholder="일정 이름" enterkeyhint="done" required>
    </div>

    <div class="pickers">
      <div class="picker-block">
        <p class="group-label">시작</p>
        <div class="group picker">
          <div id="start-h" class="wheel" aria-label="시작 시"></div>
          <span class="wheel-sep">:</span>
          <div id="start-m" class="wheel" aria-label="시작 분"></div>
        </div>
      </div>
      <div class="picker-block">
        <p class="group-label">걸리는 시간</p>
        <div class="group picker">
          <div id="dur-h" class="wheel" aria-label="시간"></div>
          <span class="wheel-unit">시간</span>
          <div id="dur-m" class="wheel" aria-label="분"></div>
          <span class="wheel-unit">분</span>
        </div>
      </div>
    </div>
    <p id="sheet-range" class="sheet-range"></p>

    <p class="group-label">색상</p>
    <div class="group">
      <div id="colors" class="colors" role="radiogroup" aria-label="색상"></div>
    </div>

    <div id="edit-actions" class="group" hidden>
      <button type="button" id="delete-stack" class="row-btn danger">스택 삭제</button>
    </div>
  </form>

  <div id="toast" class="toast" hidden role="status"></div>

  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="sources.js"></script>
  <script src="google.js"></script>
  <script src="microsoft.js"></script>
  <script src="weather.js"></script>
  <script src="app.js"></script>
</body>
</html>
